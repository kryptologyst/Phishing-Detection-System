# Random Forest model configuration
_target_: src.models.random_forest.RandomForestDetector

# Model parameters
n_estimators: 100
max_depth: 15
min_samples_split: 5
min_samples_leaf: 2
max_features: "sqrt"
bootstrap: true
random_state: 42
n_jobs: -1

# Training parameters
fit_params:
  sample_weight: null
  
# Feature importance
feature_importance:
  enabled: true
  method: "permutation"
  n_repeats: 10
